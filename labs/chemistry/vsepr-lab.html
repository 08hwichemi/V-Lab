<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSEPR 분자 모형 공방 · V-Lab</title>
<link rel="stylesheet" href="../../assets/css/lab-theme.css">
<style>
:root{
  --bg:#eef2f7; --panel:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --accent:#4f46e5; --accent2:#06b6d4; --ok:#16a34a; --warn:#f59e0b; --err:#ef4444; --exc:#8b5cf6; --beyond:#ec4899;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
header{background:linear-gradient(120deg,#1e1b4b,#312e81 55%,#155e75);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:nowrap;flex-shrink:0}
header h1{font-size:19px;margin:0;font-weight:900;letter-spacing:-.3px}
.titlewrap{display:flex;flex-direction:column;gap:3px;min-width:0}
.subrow{display:flex;align-items:center;gap:8px;min-width:0}
.vsum{font-size:12px;line-height:1.4;color:#e0e7ff;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vsum b{color:#fde68a;font-weight:700}
#vseprMore{color:#fff;font-weight:800;text-decoration:underline;text-underline-offset:2px;margin-left:2px;white-space:nowrap}
#vseprMore:hover{color:#fde68a}
.titlewrap{flex:1}
#vseprBtn{border:0;background:#fde68a;color:#78350f;font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.15)}
#vseprBtn:hover{background:#fcd34d}
.vsepr h4{margin:16px 0 7px;font-size:15px;color:#312e81}.vsepr h4:first-child{margin-top:0}
.vsepr p{margin:0 0 8px;font-size:13.5px;line-height:1.7}
.vsepr .key{background:#eef2ff;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.7}
.vsepr .rules{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7}.vsepr .rules li{margin-bottom:6px}
.vsepr .shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.vsepr .shapes div{background:#f8fafc;border-radius:10px;padding:6px 4px 8px;text-align:center;font-size:12.5px;line-height:1.45}
.vsepr .shapes svg{width:100%;height:84px}
.vsepr table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.vsepr th{background:#f1f5f9;color:#475569;padding:5px;text-align:center;border-bottom:1px solid var(--line)}
.vsepr td{padding:5px;text-align:center;border-bottom:1px solid var(--line)}
.vsepr .steps2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.vsepr .steps2 span{background:#fff7ed;color:#9a3412;border-radius:8px;padding:4px 8px;font-weight:700}
.tabs{display:flex;gap:6px;margin-left:auto;flex-shrink:0}
#helpBtn{flex-shrink:0}
.tab{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px}
.tab.on{background:#fff;color:#312e81}
main{flex:1;display:grid;grid-template-columns:clamp(230px,21vw,300px) minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px;min-height:0}
main>section{min-height:0}
.panel{background:var(--panel);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.08),0 6px 20px rgba(15,23,42,.05);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ptitle{font-size:13px;font-weight:800;color:var(--sub);padding:10px 14px 6px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
#side{overflow-y:auto;padding-bottom:14px}
.sec{padding:4px 14px 10px}
.sec h3{font-size:14px;margin:10px 0 8px}
.howto{margin:0;padding-left:18px;font-size:13px;line-height:1.65;color:#334155}
.howto b{color:var(--accent)}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.exbtn{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:6px 4px;font-size:13px;font-weight:700}
.exbtn:hover{border-color:var(--accent);color:var(--accent)}
.exbtn.hi{border-color:#fbcfe8;background:#fdf2f8;color:#be185d}
.legend{display:grid;gap:5px;font-size:12.5px;color:#334155}
.legend span{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2.5px solid}
/* editor */
#editor .toolbar{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tbtn{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;color:#334155}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn:hover:not(.on){border-color:#a5b4fc}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.lbl{font-size:11.5px;color:var(--sub);font-weight:700;margin-right:2px}
.elbtn{width:40px;height:40px;border-radius:9px;border:2px solid transparent;font-weight:900;font-size:15px;position:relative;padding:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.elbtn small{position:absolute;top:1px;left:3px;font-size:8.5px;font-weight:700;opacity:.75}
.elbtn.on{border-color:#0f172a;transform:translateY(-1px);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
#cvwrap{flex:1;position:relative;min-height:0}
#cv2{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.zoomctl{position:absolute;top:8px;right:8px;display:flex;gap:2px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 2px 8px rgba(15,23,42,.08);z-index:4}
.zoomctl button{border:0;background:transparent;border-radius:7px;min-width:30px;height:28px;font-weight:800;font-size:14px;color:#334155;padding:0 6px}
.zoomctl button:hover{background:#eef2ff;color:#4338ca}
#zReset{font-size:12px;min-width:48px}
#tip{position:absolute;pointer-events:none;background:rgba(15,23,42,.92);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;display:none;white-space:nowrap;z-index:5;line-height:1.5}
.bottombar{border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;align-items:center}
#status{flex:1;font-size:12.5px;color:#334155;min-height:18px}
.go{background:linear-gradient(120deg,#4f46e5,#06b6d4);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:900;font-size:15px;box-shadow:0 4px 14px rgba(79,70,229,.35)}
.go:hover{filter:brightness(1.08)}
/* right */
#right{display:flex;flex-direction:column;gap:12px;min-height:0}
#view{flex:1.25;position:relative;background:radial-gradient(ellipse at 50% 35%,#1e293b,#0b1120 75%);color:#fff}
#view .ptitle{color:#cbd5e1;position:absolute;top:0;left:0;z-index:3}
#cv3wrap{position:absolute;inset:0}
#cv3wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.al{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:13px;color:#fff;text-shadow:0 0 3px #000,0 0 6px #000}
.ang{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:700;background:rgba(250,204,21,.92);color:#422006;padding:1px 6px;border-radius:6px;white-space:nowrap}
#placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;font-size:14px;text-align:center;gap:8px;pointer-events:none}
#placeholder .big{font-size:42px}
.vctl{position:absolute;bottom:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:#cbd5e1;z-index:3;align-items:center}
.vctl label{display:flex;align-items:center;gap:4px;background:rgba(15,23,42,.6);padding:4px 8px;border-radius:7px;cursor:pointer}
.vctl button{background:rgba(15,23,42,.6);border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:4px 9px;font-size:12px}
#stale{position:absolute;top:8px;right:8px;z-index:3;background:#f59e0b;color:#422006;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;display:none;cursor:pointer}
#analysis{flex:1;overflow-y:auto}
#anaBody{padding:0 14px 14px;font-size:13px}
.formula{font-size:24px;font-weight:900;letter-spacing:.5px;line-height:1.5}
.cname{font-size:13.5px;font-weight:700;color:#4338ca;background:#eef2ff;border-radius:999px;padding:2px 10px;margin:0 4px 0 8px;vertical-align:4px;letter-spacing:0;white-space:nowrap}
.cname i{font-style:normal;font-weight:500;color:#6366f1;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#f1f5f9;color:#334155}
.chip.p{background:#fee2e2;color:#b91c1c}.chip.np{background:#dbeafe;color:#1d4ed8}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:#f8fafc;color:var(--sub);font-weight:700;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.lock{color:#94a3b8;font-size:11.5px}
.notes{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.notes li{padding:6px 9px;border-radius:8px;font-size:12.5px;line-height:1.5}
.n-ok{background:#f0fdf4;color:#166534}.n-warn{background:#fffbeb;color:#92400e}.n-err{background:#fef2f2;color:#991b1b}.n-exc{background:#f5f3ff;color:#5b21b6}.n-hp{background:#fdf2f8;color:#9d174d}
/* mission */
.prog{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:4px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#06b6d4);transition:width .4s}
.mlist{display:grid;gap:7px}
.freecard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px dashed #a5b4fc;background:#f8faff;border-radius:11px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;line-height:1.45}
.freecard:hover{background:#eef2ff;border-style:solid}
.mcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#fff;text-align:left;width:100%}
.mcard:hover{border-color:#a5b4fc;background:#f8faff}
.mcard .num{width:30px;height:30px;border-radius:9px;background:#eef2ff;color:#4338ca;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.mcard.done .num{background:#dcfce7;color:#15803d}
.mcard .tt{font-weight:800;font-size:13.5px}
.mcard .lv{font-size:11px;color:var(--sub)}
.lvtag{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;margin-left:4px}
.lv1{background:#e0f2fe;color:#0369a1}.lv2{background:#ede9fe;color:#6d28d9}.lv3{background:#ffedd5;color:#c2410c}
.mhead{display:flex;align-items:center;gap:8px;margin:6px 0}
.back{border:0;background:#f1f5f9;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}
.story{font-size:13.5px;line-height:1.7;background:#f8fafc;border-radius:10px;padding:10px 12px;margin:6px 0 10px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45}
.checks .ck{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;background:#e2e8f0;color:#94a3b8}
.checks .ok .ck{background:#16a34a;color:#fff}
.hintbox{font-size:13px;background:#fffbeb;color:#78350f;border-radius:10px;padding:9px 11px;margin-top:8px;line-height:1.6;display:none}
.quiz{margin-top:12px;border:2px solid #c7d2fe;border-radius:12px;padding:12px;background:#f8faff}
.quiz .q{font-weight:800;font-size:14px;margin-bottom:9px;line-height:1.5}
.qopt{display:block;width:100%;text-align:left;border:1px solid #c7d2fe;background:#fff;border-radius:9px;padding:8px 11px;margin-bottom:6px;font-size:13.5px;font-weight:600}
.qopt:hover{background:#eef2ff}
.qopt.right{background:#dcfce7;border-color:#16a34a}
.qopt.wrong{background:#fee2e2;border-color:#ef4444;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.clear{margin-top:12px;background:linear-gradient(120deg,#dcfce7,#cffafe);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.65}
.clear b.big{font-size:17px;display:block;margin-bottom:4px}
.mbtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700}
.mbtn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbtn.danger{background:#fff;color:#dc2626;border-color:#fca5a5}.mbtn.danger:hover{background:#dc2626;color:#fff;border-color:#dc2626}
/* toast & modal */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;align-items:center}
.toast{background:#0f172a;color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s;max-width:80vw}
.toast.err{background:#b91c1c}.toast.exc{background:#6d28d9}.toast.ok{background:#15803d}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal .box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:tin .25s}
#modal h2{margin:0 0 10px;font-size:18px;line-height:1.4}
#modal .body{font-size:14px;line-height:1.75;color:#334155}
#modal .body .tagline{display:inline-block;background:#fdf2f8;color:#be185d;font-weight:800;font-size:12px;padding:2px 9px;border-radius:99px;margin-bottom:8px}
#modal .body .note{background:#f8fafc;border-left:4px solid #ec4899;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:13px}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.obtn{padding:5px 8px;line-height:0}.obtn svg{width:26px;height:12px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#helpBtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px}
#helpBtn:hover{background:rgba(255,255,255,.22)}
.guide h4{margin:16px 0 7px;font-size:15px;color:#312e81}
.guide h4:first-child{margin-top:0}
.goal{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.goal li{background:#eef2ff;border-radius:9px;padding:8px 11px;font-size:13.5px;line-height:1.55}
.steps{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7}
.steps li{margin-bottom:5px}.steps b{color:#4f46e5}
.gnote{font-size:12.5px;color:#64748b;background:#f8fafc;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.6}
#mnav,#mstrip{display:none}
#mstrip{align-items:center;gap:8px;background:#eef2ff;color:#312e81;font-size:12.5px;padding:7px 10px;border-radius:10px;margin:8px 8px 0}
#mstrip .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mstrip button{border:0;background:#4f46e5;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:800;flex-shrink:0}
#mstrip button.pulse{background:#16a34a;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(22,163,74,.25)}}
/* ---------- PC: 작은 화면에서도 한 화면에 모두 보이도록 압축 ---------- */
@media (min-width:861px) and (max-width:1280px){
  main{gap:8px;padding:8px}
  header{gap:10px;padding:8px 14px}
  .vsum{font-size:11.5px}
  .elbtn{width:34px;height:34px;font-size:13.5px}
  .tbtn{padding:4px 7px;font-size:12px}
  .obtn{padding:4px 6px}
  .go{padding:9px 13px;font-size:14px}
  .vctl{gap:5px;font-size:11px}
  .vctl label{padding:3px 6px}
  table.t{font-size:11.5px}
}
@media (min-width:861px) and (max-height:800px){
  header{padding:6px 14px}
  header h1{font-size:16px}
  .tab,#helpBtn{padding:5px 12px;font-size:13px}
  main{gap:8px;padding:8px}
  .elbtn{width:34px;height:34px;font-size:13.5px}
  #editor .toolbar{padding:6px 8px;gap:5px}
  .ptitle{padding:8px 12px 4px}
  .bottombar{padding:6px 8px}
  .go{padding:8px 13px;font-size:14px}
  .formula{font-size:20px}
  .mcard{padding:7px 9px}.mcard .num{width:26px;height:26px}
  .story{padding:8px 10px;font-size:13px}
}
@media (max-width:860px){
  html,body{height:100%}
  body{height:100dvh;min-height:0;overflow:hidden}
  header{padding:8px 10px;gap:6px;flex-wrap:nowrap}
  header h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .vsum{display:none}
  .tabs{gap:4px}
  .tabs{flex-shrink:0}
  .tab{padding:5px 10px;font-size:12.5px;white-space:nowrap}
  #helpBtn{padding:5px 9px;font-size:14px;flex-shrink:0}
  main{display:block;padding:8px;height:auto;flex:1;min-height:0;overflow:hidden}
  main>section{height:100%}
  #side,#editor,#right{display:none}
  body[data-view=side] #side{display:flex}
  body[data-view=edit] #editor{display:flex}
  body[data-view=view3d] #right{display:flex}
  #editor{height:100%}
  #right{height:100%;gap:8px}
  #view{flex:none;height:55%}
  #analysis{flex:1;height:auto}
  #side{display:none;flex-direction:column}
  #editor .toolbar{padding:6px 8px;gap:5px}
  #toolRow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  #toolRow>*{flex-shrink:0}
  .elbtn{width:34px;height:34px;font-size:13.5px}
  .hidem{display:none!important}
  .bottombar{padding:6px 8px}
  #status{font-size:11.5px}
  .go{padding:9px 13px;font-size:14px}
  .vctl{gap:5px;font-size:11px}
  .vctl label{padding:3px 6px}
  table.t{font-size:11.5px}
  .mcard{padding:11px 10px}
  .story{font-size:13px}
  #mnav{display:flex;flex-shrink:0;height:60px;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  #mnav button{flex:1;border:0;background:none;font-size:12px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
  #mnav .ic{font-size:20px;line-height:1}
  #mnav button.on{color:var(--accent)}
  #mnav button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  #mnav .dot{position:absolute;top:8px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:#16a34a;display:none}
  #mnav .dot.show{display:block}
  body.has-mission:not([data-view=side]) #mstrip{display:flex}
  #toasts{bottom:72px}
  #modal{padding:10px}
  #modal .box{padding:18px 16px 14px}
}

/* ===== V-Lab 공용 테마에 맞춘 덮어쓰기 ===== */
:root{--bg:#fff;--panel:#fff;--ink:#111;--sub:#6B7280;--line:#E6E8EC;--accent:#3182F6;--accent2:#12A66B;--ok:#12A66B;--warn:#F5A623;--err:#E5484D}
body{font-family:var(--font);letter-spacing:-0.012em;-webkit-font-smoothing:antialiased}
header{background:#fff;color:#111;border-bottom:1px solid var(--line);padding:10px 18px}
header h1{font-weight:600;font-size:18px;letter-spacing:-.02em}
body.vlab-embed header h1{display:none}

<script>
/* =========================================================
   원소 데이터 (전기 음성도: 폴링 값, 교과서 표기 기준)
   ========================================================= */
const FF='"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const EL={
  H:{z:1,v:1,en:2.1,c:'#f8fafc',r:0.31,n:'수소'},
  Be:{z:4,v:2,en:1.5,c:'#a3e635',r:0.96,n:'베릴륨'},
  B:{z:5,v:3,en:2.0,c:'#fda4af',r:0.84,n:'붕소'},
  C:{z:6,v:4,en:2.5,c:'#475569',r:0.76,n:'탄소'},
  N:{z:7,v:5,en:3.0,c:'#3b82f6',r:0.71,n:'질소'},
  O:{z:8,v:6,en:3.5,c:'#ef4444',r:0.66,n:'산소'},
  F:{z:9,v:7,en:4.0,c:'#84cc16',r:0.57,n:'플루오린'},
  Si:{z:14,v:4,en:1.8,c:'#d6b48a',r:1.11,n:'규소'},
  P:{z:15,v:5,en:2.1,c:'#f97316',r:1.07,n:'인'},
  S:{z:16,v:6,en:2.5,c:'#facc15',r:1.05,n:'황'},
  Cl:{z:17,v:7,en:3.0,c:'#22c55e',r:1.02,n:'염소'},
};
const LOW=['H','Be','B','C','N','O','F','Si','P','S','Cl'];
const period=z=>z<=2?1:z<=10?2:z<=18?3:z<=36?4:z<=54?5:6;
const SUB='₀₁₂₃₄₅₆₇₈₉';
const sub=s=>String(s).replace(/\d/g,d=>SUB[d]);

/* =========================================================
   상태
   ========================================================= */
let atoms=[],bonds=[],nextId=1;
let tool='add',curEl='C',curOrder=1;
let undoStack=[];
let structVersion=0,convertedVersion=-1;
let info={};             // 원자별 분석 결과
let R3=null;             // 3D 변환 결과
let toldExc=new Set();   // 20번 이내 옥텟 예외 안내를 띄운 원자
let mode='mission',curMission=null,quizState=null;
let progress={};
try{progress=JSON.parse(localStorage.getItem('vsepr-missions-v1')||'{}')}catch(e){progress={}}
const saveProgress=()=>{try{localStorage.setItem('vsepr-missions-v1',JSON.stringify(progress))}catch(e){}};

/* =========================================================
   UI: 원소 버튼
   ========================================================= */
const elRow=document.getElementById('elRow');
function lum(hex){const n=parseInt(hex.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255}
function mkEl(sym){const e=EL[sym];const b=document.createElement('button');b.className='elbtn';b.dataset.el=sym;
  b.style.background=e.c;b.style.color=lum(e.c)>0.6?'#0f172a':'#fff';if(sym==='H')b.style.borderColor='#cbd5e1';
  b.innerHTML=`<small>${e.z}</small>${sym}`;b.title=`${e.n} (원자 번호 ${e.z}, ${period(e.z)}주기, 원자가 전자 ${e.v}개)`;
  b.onclick=()=>{curEl=sym;document.querySelectorAll('.elbtn').forEach(x=>x.classList.toggle('on',x.dataset.el===sym));if(tool!=='add'&&tool!=='swap')setTool('add')};return b}
elRow.insertAdjacentHTML('beforeend','<span class="lbl">원소</span>');
LOW.forEach(s=>elRow.appendChild(mkEl(s)));
document.querySelector('.elbtn[data-el="C"]').classList.add('on');

function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  cv.style.cursor={add:'crosshair',swap:'pointer',move:'grab',erase:'not-allowed',plus:'pointer',minus:'pointer'}[t]}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{curOrder=+b.dataset.order;document.querySelectorAll('[data-order]').forEach(x=>x.classList.toggle('on',x===b))});

/* =========================================================
   토스트 / 모달
   ========================================================= */
function toast(msg,type=''){const d=document.createElement('div');d.className='toast '+type;d.innerHTML=msg;document.getElementById('toasts').appendChild(d);setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity=0;setTimeout(()=>d.remove(),400)},3200)}
function modal(title,body,acts){document.getElementById('mTitle').innerHTML=title;document.getElementById('mBody').innerHTML=body;const a=document.getElementById('mActs');a.innerHTML='';
  acts.forEach(([txt,cls,fn])=>{const b=document.createElement('button');b.className='mbtn '+(cls||'');b.textContent=txt;b.onclick=()=>{closeModal();fn&&fn()};a.appendChild(b)});
  document.getElementById('modal').style.display='flex';document.querySelector('#modal .box').scrollTop=0}
function closeModal(){document.getElementById('modal').style.display='none'}

/* =========================================================
   구조 편집 기본 함수
   ========================================================= */
function snapshot(){return JSON.stringify({atoms,bonds,nextId})}
function pushUndo(){undoStack.push(snapshot());if(undoStack.length>80)undoStack.shift()}
function undo(){if(!undoStack.length){toast('되돌릴 작업이 없어요.');return}const s=JSON.parse(undoStack.pop());atoms=s.atoms;bonds=s.bonds;nextId=s.nextId;changed()}
const atomById=id=>atoms.find(a=>a.id===id);
const findBond=(a,b)=>bonds.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));
function addAtom(el,x,y){const a={id:nextId++,el,x,y,charge:0};atoms.push(a);return a}
function addBond(a,b,order){if(a===b)return;const ex=findBond(a,b);if(ex){ex.order=ex.order%3+1;return ex}const bd={id:nextId++,a,b,order};bonds.push(bd);return bd}
function delAtom(a){atoms=atoms.filter(x=>x!==a);bonds=bonds.filter(b=>b.a!==a.id&&b.b!==a.id);toldExc.delete(a.id)}
function nbrAngles(a){return bonds.filter(b=>b.a===a.id||b.b===a.id).map(b=>{const o=atomById(b.a===a.id?b.b:b.a);return Math.atan2(o.y-a.y,o.x-a.x)})}
function freeAngles(occ,count){const res=[];const o=[...occ];for(let k=0;k<count;k++){let best=0,bd=-1;for(let d=0;d<360;d+=5){const t=d*Math.PI/180;let m=Math.PI;o.forEach(q=>{let df=Math.abs(((t-q)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI);m=Math.min(m,df)});if(m>bd+1e-6){bd=m;best=t}}res.push(best);o.push(best)}return res}
function addNeighbor(a,el,order=1){const t=freeAngles(nbrAngles(a),1)[0];const L=el==='H'||a.el==='H'?52:64;const n=addAtom(el,a.x+Math.cos(t)*L,a.y+Math.sin(t)*L);addBond(a.id,n.id,order);return n}

/* =========================================================
   전자 분석 (루이스 구조)
   ========================================================= */
const SHAPE={'2,0':'직선형','3,0':'평면 삼각형','2,1':'굽은 형','4,0':'정사면체형','3,1':'삼각뿔형','2,2':'굽은 형','5,0':'삼각쌍뿔형','4,1':'시소형','3,2':'T자형','2,3':'직선형','6,0':'정팔면체형','5,1':'사각뿔형','4,2':'평면 사각형','3,3':'T자형','2,4':'직선형'};
const EG={2:'직선형',3:'평면 삼각형',4:'정사면체형',5:'삼각쌍뿔형',6:'정팔면체형'};
function analyze(){
  info={};
  atoms.forEach(a=>info[a.id]={a,nbrs:[],sumBO:0});
  bonds.forEach(b=>{info[b.a].nbrs.push(b.b);info[b.b].nbrs.push(b.a);info[b.a].sumBO+=b.order;info[b.b].sumBO+=b.order});
  for(const id in info){
    const I=info[id],a=I.a,e=EL[a.el],p=period(e.z);
    const rem=e.v-a.charge-I.sumBO;
    I.rem=rem;I.lp=rem>=0?Math.floor(rem/2):0;I.single=rem>=0?rem%2:0;
    I.electrons=2*I.sumBO+Math.max(rem,0);I.nb=I.nbrs.length;I.L=I.lp+I.single;I.n=I.nb+I.L;
    let st='ok',msg='';
    if(rem<0){st='error';msg=`${a.el}: 원자가 전자(${e.v}개)보다 결합이 많아요. 결합 수나 전하를 확인하세요.`}
    else if(I.n>6){st='error';msg=`${a.el}: 전자쌍이 7개 이상인 구조는 이 프로그램에서 다루지 않아요.`}
    else if(a.el==='H'){if(I.electrons===2){st='ok';msg='H: 전자 2개 (듀엣 규칙 만족)'}else{st='incomplete';msg='H: 전자 2개가 되도록 결합 1개가 필요해요.'}}
    else if(I.electrons>8){
      if(p<=2){st='error';msg=`${a.el}: 2주기 원소는 주위에 전자를 8개보다 많이 가질 수 없어요. (현재 ${I.electrons}개)`}
      else{st='expanded';msg=`${a.el}: 전자 ${I.electrons}개 — 옥텟 규칙의 예외(확장된 옥텟)로 허용돼요.`}
    }
    else if(I.electrons===8){st='ok';msg=`${a.el}: 전자 8개 (옥텟 규칙 만족)`}
    else{
      if(['Be','B'].includes(a.el)&&rem===0&&I.nb>0){st='deficient';msg=`${a.el}: 전자 ${I.electrons}개 — 옥텟 규칙의 예외(전자 부족)로 허용돼요.`}
      else{st='incomplete';msg=I.single?`${a.el}: 짝을 이루지 않은 전자(홀전자)가 있어요. 결합이나 전하를 조정해 보세요.`:`${a.el}: 전자 ${I.electrons}개 — 옥텟까지 ${8-I.electrons}개가 부족해요.`}
    }
    I.st=st;I.msg=msg;
    I.shape=I.nb>=2?SHAPE[I.nb+','+I.L]||'-':null;I.eg=I.nb>=2?EG[I.n]||'-':null;
  }
  return info;
}
function components(){const seen=new Set();const comps=[];atoms.forEach(a=>{if(seen.has(a.id))return;const c=[];const st=[a.id];seen.add(a.id);while(st.length){const x=st.pop();c.push(x);info[x].nbrs.forEach(n=>{if(!seen.has(n)){seen.add(n);st.push(n)}})}comps.push(c)});return comps}
function formulaCounts(){const c={};atoms.forEach(a=>c[a.el]=(c[a.el]||0)+1);return c}
function totalCharge(){return atoms.reduce((s,a)=>s+a.charge,0)}
function chargeStr(q){if(!q)return'';const m=Math.abs(q);return (m>1?m:'')+(q>0?'+':'−')}
// 화학식: 관습적 표기 (NH₃, H₂O, HCl, HCN, CH₃OH 등)
const INORG=['Be','B','Si','C','P','N','H','S','Cl','O','F'];   // 무기 화합물에서 앞에 쓰는 원소 → 뒤에 쓰는 원소
const FORMULA_FIX={'C1H1N1':'HCN','C1H2O1':'HCHO','C1H4O1':'CH3OH','C1H2O2':'HCOOH','C1H5N1':'CH3NH2','C2H4O1':'CH3CHO','H1O1|-1':'OH','C1H3|-1':'CH3'};
function formulaStr(counts,q,ids){
  const ks=Object.keys(counts).filter(k=>counts[k]>0);const key=ks.slice().sort().map(k=>k+counts[k]).join('');
  if(FORMULA_FIX[key+'|'+q])return FORMULA_FIX[key+'|'+q];if(FORMULA_FIX[key])return FORMULA_FIX[key];
  // 구조에 따라 달라지는 경우 (에탄올/다이메틸 에터, 아세트산/폼산 메틸)
  if(ids&&(key==='C2H6O1'||key==='C2H4O2')){const oh=ids.some(id=>atomById(id).el==='O'&&info[id].nbrs.some(n=>atomById(n).el==='H'));

/* ---------- 원자 간 거리 조정 ----------
   · 결합 길이: 같은 종류의 결합은 같은 길이, 다른 결합은 원자 크기와 결합 차수(단일 > 2중 > 3중)에 맞게
   · 결합 방향: 중심 원자의 전자쌍 수(결합 + 비공유 전자쌍)에 맞춰 고르게 배치 (비공유 전자쌍 자리는 비워 둠)
   · 떨어진 분자끼리는 겹치지 않게 나란히 배치 */
const len2D=(a,b,o)=>30+16*(EL[a].r+EL[b].r)*1.9*(o===2?0.88:o===3?0.8:1);
const nang=t=>Math.atan2(Math.sin(t),Math.cos(t));
// 고리 찾기: 스패닝 트리에 들어가지 않은 결합마다, 그 결합을 빼고 두 원자를 잇는 가장 짧은 경로 = 고리
function findRings(comp){
  const set=new Set(comp),key=(a,b)=>a<b?a+'_'+b:b+'_'+a,seen=new Set([comp[0]]),order=[comp[0]],tree=new Set();
  for(let i=0;i<order.length;i++){const x=order[i];info[x].nbrs.forEach(n=>{if(!seen.has(n)){seen.add(n);order.push(n);tree.add(key(x,n))}})}
  const rings=[],keys=new Set();
  bonds.forEach(b=>{if(!set.has(b.a)||tree.has(key(b.a,b.b)))return;const prev=new Map([[b.a,null]]),q=[b.a];
    while(q.length){const x=q.shift();if(x===b.b)break;info[x].nbrs.forEach(n=>{if(prev.has(n)||(x===b.a&&n===b.b))return;prev.set(n,x);q.push(n)})}
    if(!prev.has(b.b))return;const path=[];for(let x=b.b;x!==null;x=prev.get(x))path.push(x);
    const k=path.slice().sort((u,v)=>u-v).join(',');if(!keys.has(k)){keys.add(k);rings.push(path)}});
  return rings}
function tidyLayout(){
  if(!atoms.length){toast('먼저 분자를 그려 주세요.');return}
  resetView();
  const P={};let ringCount=0;const comps=components();
  comps.forEach(comp=>{
    const rings=findRings(comp);ringCount+=rings.length;const ringDone=new Set();
    const ringL=r=>r.reduce((s,x,i)=>{const y=r[(i+1)%r.length];return s+len2D(atomById(x).el,atomById(y).el,bondOrder(x,y))},0)/r.length;
    const placedC=()=>{let x=0,y=0,c=0;for(const id in P){if(comp.includes(+id)){x+=P[id].x;y+=P[id].y;c++}}return c?{x:x/c,y:y/c}:{x:0,y:0}};
    // 고리를 정다각형으로 배치 (이미 놓인 원자 0개: 원점 / 1개: 그 원자에서 바깥쪽으로 / 이웃한 2개: 공유한 변의 반대편으로)
    const placeRing=ri=>{const r=rings[ri],n=r.length,st=2*Math.PI/n;let L=ringL(r);
      const sh=r.findIndex((x,i)=>P[x]&&P[r[(i+1)%n]]);if(sh>=0){const a=P[r[sh]],b=P[r[(sh+1)%n]];L=Math.hypot(a.x-b.x,a.y-b.y)}   // 변을 공유하는 고리는 그 변 길이에 맞춤
      const R=L/(2*Math.sin(Math.PI/n));
      let area=0;r.forEach((x,i)=>{const p=atomById(x),q=atomById(r[(i+1)%n]);area+=p.x*q.y-q.x*p.y});let sg=area>=0?1:-1;
      const pl=r.map((x,i)=>i).filter(i=>P[r[i]]);let C,th0,i0=0;
      if(!pl.length){const o={x:0,y:0};r.forEach(x=>{o.x+=atomById(x).x/n;o.y+=atomById(x).y/n});const a=atomById(r[0]);th0=Math.atan2(a.y-o.y,a.x-o.x);C={x:0,y:0}}
      else if(pl.length===1){i0=pl[0];const a=r[i0];let dx=0,dy=0;info[a].nbrs.forEach(m=>{if(P[m]&&!r.includes(m)){const l=Math.hypot(P[a].x-P[m].x,P[a].y-P[m].y)||1;dx+=(P[a].x-P[m].x)/l;dy+=(P[a].y-P[m].y)/l}});
        if(Math.hypot(dx,dy)<1e-6){dx=1;dy=0}const l=Math.hypot(dx,dy);C={x:P[a].x+dx/l*R,y:P[a].y+dy/l*R};th0=Math.atan2(P[a].y-C.y,P[a].x-C.x)}
      else{let i=pl.find(j=>P[r[(j+1)%n]]);if(i===undefined)return false;i0=i;const a=P[r[i]],b=P[r[(i+1)%n]];const M={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
        let nx=-(b.y-a.y),ny=b.x-a.x;const nl=Math.hypot(nx,ny)||1;nx/=nl;ny/=nl;const ap=R*Math.cos(Math.PI/n),g=placedC();
        const c1={x:M.x+nx*ap,y:M.y+ny*ap},c2={x:M.x-nx*ap,y:M.y-ny*ap};C=Math.hypot(c1.x-g.x,c1.y-g.y)>=Math.hypot(c2.x-g.x,c2.y-g.y)?c1:c2;
        th0=Math.atan2(a.y-C.y,a.x-C.x);sg=nang(Math.atan2(b.y-C.y,b.x-C.x)-th0)>=0?1:-1}
      r.forEach((x,i)=>{if(P[x])return;const k=((i-i0)%n+n)%n,t=th0+sg*k*st;P[x]={x:C.x+Math.cos(t)*R,y:C.y+Math.sin(t)*R}});ringDone.add(ri);return true};
    const done=new Set(),q=[];const push=id=>{if(!done.has(id)){done.add(id);q.push(id)}};
    if(rings.length){placeRing(0);rings[0].forEach(push)}
    else{const root=comp.reduce((m,x)=>info[x].nb>info[m].nb?x:m,comp[0]);P[root]={x:0,y:0};push(root)}
    while(q.length){const id=q.shift();const I=info[id],A=atomById(id);
      rings.forEach((r,ri)=>{if(!ringDone.has(ri)&&r.includes(id)&&placeRing(ri))r.forEach(push)});
      const kids=I.nbrs.filter(x=>!P[x]);if(!kids.length)continue;const placedN=I.nbrs.filter(x=>P[x]);let slots=[];
      if(placedN.length>=2){
        // 고리 원자 등: 이미 놓인 결합들 사이의 가장 넓은 빈 각도에 나머지 원자를 고르게 배치
        const angs=placedN.map(m=>Math.atan2(P[m].y-P[id].y,P[m].x-P[id].x)).sort((u,v)=>u-v);let gs=0,gz=-1;
        angs.forEach((t,i)=>{const nx=i+1<angs.length?angs[i+1]:angs[0]+2*Math.PI;if(nx-t>gz){gz=nx-t;gs=t}});
        kids.sort((u,v)=>(atomById(u).el==='H')-(atomById(v).el==='H'));
        const order=kids.map((k,i)=>i);const mid=(kids.length-1)/2;order.sort((u,v)=>Math.abs(u-mid)-Math.abs(v-mid));
        const posIdx=[...Array(kids.length).keys()];posIdx.sort((u,v)=>Math.abs(u-mid)-Math.abs(v-mid));
        kids.forEach((k,i)=>slots.push([k,gs+gz*(posIdx[i]+1)/(kids.length+1)]))}
      else{const n=Math.max(I.n,1),step=2*Math.PI/n;
        if(!placedN.length){const ang=k=>Math.atan2(atomById(k).y-A.y,atomById(k).x-A.x);kids.sort((u,v)=>nang(ang(u))-nang(ang(v)));
          const base=Math.round(ang(kids[0])/(Math.PI/12))*(Math.PI/12);slots=kids.map((k,i)=>[k,base+i*step])}
        else{const par=placedN[0];const tp=Math.atan2(P[par].y-P[id].y,P[par].x-P[id].x);const free=[];for(let j=1;j<n;j++)free.push(tp+j*step);
          // 사슬이 곧게 뻗도록: H가 아닌 원자를 부모의 반대쪽 자리에 먼저 배치
          free.sort((u,v)=>Math.abs(Math.abs(nang(u-tp))-Math.PI)-Math.abs(Math.abs(nang(v-tp))-Math.PI));
          const heavy=kids.filter(k=>atomById(k).el!=='H'),hs=kids.filter(k=>atomById(k).el==='H');
          heavy.forEach(k=>slots.push([k,free.shift()]));
          // 남은 자리 중 수소는 서로 이웃한 자리부터 (비공유 전자쌍은 나머지 자리)
          free.sort((u,v)=>nang(u-tp)-nang(v-tp));const cw=free.filter(t=>nang(t-tp)>0),ccw=free.filter(t=>nang(t-tp)<0).reverse();const order=[];
          while(cw.length||ccw.length){if(cw.length)order.push(cw.shift());if(ccw.length)order.push(ccw.shift())}
          hs.forEach(k=>slots.push([k,order.shift()]))}}
      slots.forEach(([k,t])=>{if(t===undefined||P[k])return;const L=len2D(A.el,atomById(k).el,bondOrder(id,k));P[k]={x:P[id].x+Math.cos(t)*L,y:P[id].y+Math.sin(t)*L};push(k)})}
    comp.forEach(id=>{if(!P[id]){const a=atomById(id);P[id]={x:a.x,y:a.y}}})});
  // 분자들을 겹치지 않게 나란히
  // 보드 크기에 맞게 줄을 나눠 배치하고, 넘치면 전체를 조금씩 줄임
  const base={};comps.forEach(c=>c.forEach(id=>base[id]={x:P[id].x,y:P[id].y}));const pad=34,BH=H-30;
  for(let sc=1;sc>=0.55;sc-=0.05){comps.forEach(c=>c.forEach(id=>{P[id].x=base[id].x*sc;P[id].y=base[id].y*sc}));
    const boxes=comps.map(c=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;c.forEach(id=>{x0=Math.min(x0,P[id].x);y0=Math.min(y0,P[id].y);x1=Math.max(x1,P[id].x);y1=Math.max(y1,P[id].y)});return{c,x0:x0-pad,y0:y0-pad,x1:x1+pad,y1:y1+pad}});
    const rows=[[]];let rw=0;boxes.forEach(b=>{const w=b.x1-b.x0;if(rw+w>W-10&&rows[rows.length-1].length){rows.push([]);rw=0}rows[rows.length-1].push(b);rw+=w});
    const totalH=rows.reduce((s,r)=>s+Math.max(...r.map(b=>b.y1-b.y0)),0);
    if(totalH>BH&&sc>0.6)continue;
    let y=Math.max(4,(BH-totalH)/2);
    rows.forEach(r=>{const rowW=r.reduce((s,b)=>s+b.x1-b.x0,0),rh=Math.max(...r.map(b=>b.y1-b.y0));let x=Math.max(4,(W-rowW)/2);
      r.forEach(b=>{const dx=x-b.x0,dy=y+(rh-(b.y1-b.y0))/2-b.y0;b.c.forEach(id=>{P[id].x+=dx;P[id].y+=dy});x+=b.x1-b.x0});y+=rh});
    break}
  pushUndo();const from={};atoms.forEach(a=>from[a.id]={x:a.x,y:a.y});const t0=performance.now();
  (function step(now){const k=Math.min(1,(now-t0)/450),e=1-Math.pow(1-k,3);atoms.forEach(a=>{a.x=from[a.id].x+(P[a.id].x-from[a.id].x)*e;a.y=from[a.id].y+(P[a.id].y-from[a.id].y)*e});draw();if(k<1)requestAnimationFrame(step)})(t0);
  toast(ringCount?'원자 간 거리를 조정했어요. 고리는 정다각형으로 맞췄어요.':'원자 간 거리를 조정했어요. 같은 결합은 같은 길이로 맞췄어요.');

function eig3(A){const a=A.map(r=>r.slice()),v=[[1,0,0],[0,1,0],[0,0,1]];

    for(let k=0;k<3;k++){const x=a[k][p],y=a[k][q];a[k][p]=c*x-s*y;a[k][q]=s*x+c*y}
    for(let k=0;k<3;k++){const x=a[p][k],y=a[q][k];a[p][k]=c*x-s*y;a[q][k]=s*x+c*y}

  if(comps.length>1)h+=`<span class="chip" style="background:#fef3c7;color:#92400e">분리된 조각 ${comps.length}개</span>`;
  if(fresh&&R3.polar!==null)h+=locked?`<span class="chip">극성: 🔒 미션 클리어 후 공개</span>`:`<span class="chip ${R3.polar?'p':'np'}">${R3.polar?'극성 분자':'무극성 분자'}</span>`;
  h+='</div>';
  const centers=atoms.filter(a=>info[a.id].nb>=2);
  if(centers.length){h+=`<table class="t"><tr><th>중심 원자</th><th>공유/비공유<br>전자쌍 수</th><th>전자쌍 배치</th><th>분자 모양</th><th>결합각</th></tr>`;
    centers.forEach(a=>{const I=info[a.id];const c=fresh?R3.centers.find(x=>x.id===a.id):null;
      const domains=I.nb+I.L;
      h+=`<tr><td><b>${a.el}</b>${a.charge?`<sup>${chargeStr(a.charge)}</sup>`:''}</td><td>결합 원자 ${I.nb} · 비공유 ${I.lp}${I.single?' · 홀전자 1':''}<br><span style="color:#94a3b8;font-size:11.5px">전자쌍 영역 ${domains}개</span></td>
      <td>${locked?'<span class="lock">🔒</span>':I.eg}</td><td>${locked?'<span class="lock">🔒 클리어 후 공개</span>':`<b>${I.shape}</b>`}</td><td>${c?c.angles.map(x=>(x.g%1?x.g.toFixed(1):x.g)+'°').join(', '):'<span class="lock">3D 변환 후</span>'}</td></tr>`});
    h+='</table><div style="font-size:11.5px;color:#94a3b8;margin-top:5px">※ 다중 결합(2중·3중 결합)은 전자쌍 반발 이론에서 하나의 전자쌍 영역으로 취급해요.</div>'}
  else if(atoms.length===2&&bonds.length===1)h+=`<p style="font-size:13px">원자 2개로 이루어진 분자는 항상 <b>직선형</b>이에요.</p>`;
  // 원자 상태
  const groups={error:[],incomplete:[],exc:[]};atoms.forEach(a=>{const I=info[a.id];if(I.st==='error')groups.error.push(I.msg);else if(I.st==='incomplete')groups.incomplete.push(I.msg);else if(I.st==='deficient'||I.st==='expanded')groups.exc.push(I.msg)});
  const uniq=a=>[...new Set(a)];h+='<ul class="notes">';
  uniq(groups.error).forEach(m=>h+=`<li class="n-err">⛔ ${m}</li>`);uniq(groups.incomplete).forEach(m=>h+=`<li class="n-warn">⚠️ ${m}</li>`);
  uniq(groups.exc).forEach(m=>h+=`<li class="n-exc">✔ ${m}</li>`);
  if(!groups.error.length&&!groups.incomplete.length)h+=`<li class="n-ok">✅ 모든 원자가 옥텟 규칙(H는 2개) 또는 허용된 예외를 만족해요.</li>`;
  if(!fresh)h+=`<li class="n-warn" style="background:#eef2ff;color:#3730a3">▶ <b>3D로 변환</b>을 누르면 결합각과 극성을 확인할 수 있어요.</li>`;
  h+='</ul>';el.innerHTML=h;
}

function star(c,lig,charge=0){const cx=W/2,cy=H/2;const a=addAtom(c,cx,cy);a.charge=charge;const n=lig.length;
  lig.forEach(([el,o],i)=>{const t=-Math.PI/2+i*2*Math.PI/n+(n===2?Math.PI/2:0);const L=el==='H'?56:72;const b=addAtom(el,cx+Math.cos(t)*L,cy+Math.sin(t)*L);addBond(a.id,b.id,o)})}
const EXAMPLES={
  'H₂O':()=>star('O',[['H',1],['H',1]]),'NH₃':()=>star('N',[['H',1],['H',1],['H',1]]),'CH₄':()=>star('C',[['H',1],['H',1],['H',1],['H',1]]),
  'CO₂':()=>star('C',[['O',2],['O',2]]),'BF₃':()=>star('B',[['F',1],['F',1],['F',1]]),'BeCl₂':()=>star('Be',[['Cl',1],['Cl',1]]),
  'C₂H₄':()=>{const cx=W/2,cy=H/2;const a=addAtom('C',cx-34,cy),b=addAtom('C',cx+34,cy);addBond(a.id,b.id,2);[[-1,-1],[-1,1]].forEach(([sx,sy])=>{const h=addAtom('H',cx-34-30,cy+sy*48);addBond(a.id,h.id,1)});[[1,-1],[1,1]].forEach(([sx,sy])=>{const h=addAtom('H',cx+34+30,cy+sy*48);addBond(b.id,h.id,1)})},
  'C₂H₂':()=>{const cx=W/2,cy=H/2;const a=addAtom('C',cx-34,cy),b=addAtom('C',cx+34,cy);addBond(a.id,b.id,3);const h1=addAtom('H',cx-90,cy),h2=addAtom('H',cx+90,cy);addBond(a.id,h1.id,1);addBond(b.id,h2.id,1)},
  'C₆H₆':()=>{const cx=W/2,cy=H/2;const cs=[];for(let i=0;i<6;i++){const t=i*Math.PI/3-Math.PI/2;cs.push(addAtom('C',cx+Math.cos(t)*58,cy+Math.sin(t)*58));const h=addAtom('H',cx+Math.cos(t)*108,cy+Math.sin(t)*108);addBond(cs[i].id,h.id,1)}for(let i=0;i<6;i++)addBond(cs[i].id,cs[(i+1)%6].id,i%2?1:2)},
  'PCl₅':()=>star('P',[['Cl',1],['Cl',1],['Cl',1],['Cl',1],['Cl',1]]),'SF₆':()=>star('S',[['F',1],['F',1],['F',1],['F',1],['F',1],['F',1]]),
};
function loadExample(k){pushUndo();atoms=[];bonds=[];if(isMobile())setView('edit');resize2D();resetView();EXAMPLES[k]();changed();toast(`${k} 구조식을 불러왔어요. ▶ 3D로 변환을 눌러 보세요!`)}

function missionChecks(m){
  const checks=[];const comps=atoms.length?components().length:0;
  const valid=atoms.length>0&&atoms.every(a=>['ok','deficient'].includes(info[a.id].st));
  if(m.formula){const f=formulaCounts();const same=Object.keys(m.formula).length===Object.keys(f).length&&Object.entries(m.formula).every(([k,v])=>f[k]===v);
    checks.push({label:`원소 구성 ${formulaHTML(m.formula,0)}`,ok:same});checks.push({label:`전체 전하 ${m.charge?chargeStr(m.charge):'0'}`,ok:atoms.length>0&&totalCharge()===m.charge})}
  checks.push({label:'하나로 연결된 분자',ok:comps===1});
  checks.push({label:'모든 원자가 옥텟 규칙(H는 2개) 또는 허용된 예외 만족',ok:valid});
  if(m.cond)checks.push(...m.cond());
  const fresh=R3&&convertedVersion===structVersion;
  checks.push({label:'▶ 3D로 변환해 분자 모양 관찰',ok:fresh&&checks.every(c=>c.ok)});
  return checks;
}

/* =========================================================
   휴대폰 화면 전환
   ========================================================= */
const mq=window.matchMedia('(max-width:860px)');
const isMobile=()=>mq.matches;
function setView(v){document.body.dataset.view=v;if(v==='edit')requestAnimationFrame(resize2D);document.querySelectorAll('#mnav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='view3d')setTimeout(resize3D,30)}
document.querySelectorAll('#mnav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.getElementById('mstripB').onclick=()=>setView('side');
function updateMobileUI(){
  document.getElementById('navSideIc').textContent=mode==='mission'?'🎯':'📋';
  document.getElementById('navSideTx').textContent=mode==='mission'?'미션':'안내·예시';
  document.body.classList.toggle('has-mission',!!(mode==='mission'&&curMission));
  const dot=document.getElementById('navDot');dot.classList.remove('show');
  if(mode==='mission'&&curMission){const ch=missionChecks(curMission);const ok=ch.filter(c=>c.ok).length;const cleared=!!progress[curMission.id];const quiz=!cleared&&ok===ch.length;
    document.getElementById('mstripT').innerHTML=`🎯 <b>${curMission.title}</b> · ${cleared?'★ 클리어':`조건 ${ok}/${ch.length}`}`;
    const b=document.getElementById('mstripB');b.textContent=quiz?'✏️ 확인 문제 풀기':'미션 보기';b.classList.toggle('pulse',quiz);dot.classList.toggle('show',quiz)}
}

/* =========================================================
   모드 전환
   ========================================================= */
function switchMode(m){if(mode===m)return;mode=m;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));curMission=null;renderSide();renderAnalysis();if(isMobile())setView(m==='mission'?'side':'edit')}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchMode(t.dataset.mode));

analyze();renderSide();renderAnalysis();setView(isMobile()?'side':'edit');showGuide(true);
</script>
